<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav>
        <div class="container nav-container">
            <a href="../index.html" class="logo">ABHIJAY SALVI</a>
            <ul class="nav-links">
                <li><a href="../index.html#about">About</a></li>
                <li><a href="../index.html#education">Education</a></li>
                <li><a href="../index.html#experience">Experience</a></li>
                <li><a href="../index.html#projects">Projects</a></li>
                <li><a href="../assets/resume.pdf" class="btn" target="_blank">Resume</a></li>
                <li id="theme-toggle" class="theme-toggle">🌙</li>
            </ul>
        </div>
    </nav>

    <main class="container" style="padding-top: 4rem;">
        <nav class="breadcrumb-nav">
            <a href="../index.html"><i class="fas fa-home"></i> Home</a>
            <span class="breadcrumb-separator">/</span>
            <a href="../index.html#projects">Projects</a>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-current">All Projects</span>
        </nav>
        
        <h1 class="section-title" style="margin-top: 2rem;">All Projects</h1>
        <div class="projects-grid" id="grid-container">
            </div>
    </main>

    <script src="../data.js"></script>
    <script>
        const container = document.getElementById('grid-container');
        
        PROJECTS.forEach(p => {
            const card = document.createElement('div');
            card.className = 'grid-card';
            card.innerHTML = `
                <div style="height: 150px; background: var(--card-bg); display: flex; align-items: center; justify-content: center; color: var(--text-secondary); border-bottom: 1px solid rgba(255, 255, 255, 0.05);">
                    Placeholder Image
                </div>
                <div class="grid-content">
                    <h3 style="margin-bottom: 0.5rem; color: var(--text-primary);">${p.title}</h3>
                    <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1rem;">${p.blurb}</p>
                    <div style="font-size: 0.8rem; color: var(--accent-color); font-family: monospace;">${p.tech.slice(0,3).join(' ')}</div>
                </div>
            `;
            card.style.cursor = 'pointer';
            card.onclick = () => window.location.href = `project.html?id=${p.id}`;
            container.appendChild(card);
        });
    </script>
</body>
</html>
